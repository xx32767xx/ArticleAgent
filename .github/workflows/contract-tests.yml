# 契约测试门禁:PR 时跑快档(合并门槛),合并进 main 后兜底
# 说明见 DOC-004 §3.1「CI 门禁」。入口约定:tools/devkit/run_contract_tests.py
# 真接口验证不设自动档,需要时由接口负责人本地手动跑:--mode real
name: contract-tests

on:
  pull_request:              # 每次开 PR / 更新 PR 自动跑(快档)
  push:
    branches: [ main ]       # 合并进 main 后再跑一遍(兜底)

jobs:
  quick:
    name: 快档(单测 + 对桩契约测试)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install "mcp>=1.0" pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: 入口就绪检查(未就绪则跳过,不误红)
        id: guard
        run: |
          if [ -f tools/devkit/run_contract_tests.py ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::契约测试入口 tools/devkit/run_contract_tests.py 尚未就绪,本档跳过(见 DOC-004 §3.1)"
          fi
      - name: 跑契约测试(桩模式)
        if: steps.guard.outputs.ready == 'true'
        run: python tools/devkit/run_contract_tests.py --mode stub
